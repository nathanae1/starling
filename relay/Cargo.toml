# Starling headless relay — Cargo workspace (Plan 15, R3).
#
# A single self-hostable Rust binary that embeds Arti (Tor) and acts as an
# always-on store-and-forward cache for one or more Owners' encrypted
# content. It never decrypts (zero-knowledge); it serves Followers when an
# Owner's phone is offline.
#
# `starling-arti` is ALSO consumed by the phone's FFI bridge
# (app/starling/native/starling_bridge) via a path dependency, so the
# arti/tor version pins here MUST stay identical to the ones that crate
# relied on. See app/plans/15-headless-relay.md.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# --- arti / tor (pinned to the same 0.34 line as the phone bridge) ---
arti-client = { version = "0.34", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service"] }
tor-hsservice = { version = "0.34" }
tor-hsrproxy = { version = "0.34" }
tor-rtcompat = { version = "0.34", features = ["tokio", "rustls"] }
tor-keymgr = { version = "0.34" }
tor-socksproto = { version = "0.34" }
fs-mistrust = "0.10"
safelog = "0.5"

# tor-dirmgr → rusqlite → libsqlite3-sys. `bundled` keeps SQLite static and
# must match the phone bridge's pin so Cargo feature-unification stays
# consistent across the shared `starling-arti` dependency.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }

# --- shared runtime / encoding ---
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "signal", "fs"] }
anyhow = "1"
log = "0.4"
futures = "0.3"

# --- wire / crypto (zero-knowledge boundary: NO feed-key/decrypt deps) ---
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
blake2 = "0.10"
hex = "0.4"
base64 = "0.22"

# --- storage ---
# rusqlite/libsqlite3-sys MUST match what arti's tor-dirmgr resolves
# (libsqlite3-sys 0.35 → rusqlite 0.37) so only one crate links `sqlite3`.
rusqlite = "0.37"
r2d2 = "0.8"
r2d2_sqlite = "0.31"

# --- internal crates ---
# default-features off → no SOCKS listener (the relay only serves inbound
# onion traffic). The phone bridge depends on this crate by path with
# default features, so it still gets the listener it needs.
starling-arti = { path = "crates/starling-arti", default-features = false }
starling-wire = { path = "crates/starling-wire" }
starling-relay-storage = { path = "crates/starling-relay-storage" }
starling-relay-http = { path = "crates/starling-relay-http" }
starling-relay-admin = { path = "crates/starling-relay-admin" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
