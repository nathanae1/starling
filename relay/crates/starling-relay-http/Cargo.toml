[package]
name = "starling-relay-http"
description = "Per-Owner HTTP router for the Starling relay: the Follower-facing read endpoints and the Owner-authenticated push endpoints."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.7"
tower = "0.5"
bytes = "1"
serde.workspace = true
ciborium.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow.workspace = true
tokio = { workspace = true }
log.workspace = true
starling-wire.workspace = true
starling-relay-storage.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = "2"
ciborium.workspace = true
tempfile = "3"
