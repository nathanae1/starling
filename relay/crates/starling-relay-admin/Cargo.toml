[package]
name = "starling-relay-admin"
description = "Admin web UI + onion-facing /pair handler for the Starling relay."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.7"
askama = "0.12"
# default-features off drops the heavy `image` codec stack; we only render
# SVG (web) and unicode (CLI), both always available.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
async-trait = "0.1"
bytes = "1"
rand = "0.8"
argon2 = "0.5"
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
base64.workspace = true
hex.workspace = true
subtle.workspace = true
anyhow.workspace = true
log.workspace = true
tokio = { workspace = true }
starling-wire.workspace = true
starling-relay-storage.workspace = true
# For the shared rate-limit middleware only (no router coupling).
starling-relay-http.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = "2"
