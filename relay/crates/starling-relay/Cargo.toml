[package]
name = "starling-relay"
description = "Starling headless relay: a self-hostable always-on store-and-forward cache that serves an Owner's encrypted content over Tor when their phone is offline."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "starling-relay"

[[bin]]
name = "starling-relay"
path = "src/main.rs"

[dependencies]
# The relay does not need the phone's SOCKS5 listener (the workspace dep
# already sets default-features = false).
starling-arti = { workspace = true }
starling-wire.workspace = true
starling-relay-storage.workspace = true
starling-relay-http.workspace = true
starling-relay-admin.workspace = true

tokio = { workspace = true }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
toml = "0.8"
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
hex.workspace = true
async-trait = "0.1"
serde_json.workspace = true
qrcode = { version = "0.14", default-features = false }
