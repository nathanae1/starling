# Starling relay configuration. Copy to /etc/starling-relay/config.toml.
# Every value can be overridden with a STARLING_RELAY_<UPPER_SNAKE> env var
# (e.g. STARLING_RELAY_BIND_ADMIN=0.0.0.0:8088).

# Where Tor state, the SQLite DB, media blobs, and the admin socket live.
data_dir = "/var/lib/starling-relay"

# Admin web UI bind address. Keep it on localhost and reach it over an SSH
# tunnel (ssh -L 8088:127.0.0.1:8088 user@host). Only bind to a LAN/0.0.0.0
# address AFTER setting a password (`starling-relay set-password`).
bind_admin = "127.0.0.1:8088"

# Host-wide storage cap across all Owners, in bytes (5 GiB default).
disk_cap_bytes = 5368709120

# Default per-Owner cap, in bytes (1 GiB). Applied when an Owner has no
# explicit cap.
per_owner_default_cap_bytes = 1073741824

# Log level: error | warn | info | debug | trace.
log_level = "info"

# How long a pairing token is valid, in seconds.
pairing_token_ttl_seconds = 600

# Loopback port range Arti reverse-proxies each Owner's onion to.
# Env form is a hyphenated pair: STARLING_RELAY_LOCAL_PORT_RANGE=17000-17999.
local_port_range = [17000, 17999]

# --- Voice (SFU) hosting — Plan 20 ------------------------------------------
# When enabled, live calls in rooms created by paired owners are hosted on
# this relay as a forwarding-only SFU: every participant sends one audio
# stream up, the relay fans it out. The relay forwards END-TO-END ENCRYPTED
# frames it cannot decrypt, and never learns participant identities — only
# blinded room tokens, ephemeral ids, and (unavoidably) participant IPs.
#
# NOTE: this opens the relay's FIRST clearnet socket (one UDP port for
# media). Signaling stays on the per-owner onions. Participants must be able
# to reach the UDP port directly: port-forward it, or run with public
# v4/global v6. Env overrides: STARLING_RELAY_VOICE_ENABLED,
# STARLING_RELAY_VOICE_UDP_PORT, STARLING_RELAY_VOICE_MAX_PARTICIPANTS,
# STARLING_RELAY_VOICE_MAX_CONCURRENT_CALLS, and
# STARLING_RELAY_VOICE_ADVERTISED_ADDRS (comma-separated).
[voice]
enabled = false

# UDP media port. 0 = OS-assigned each boot — fine for LAN/v6 testing,
# useless behind a port-forward: set an explicit port to forward.
udp_port = 0

# Extra ICE host candidates ("ip" or "ip:port") for the port-forwarded
# home-NAT case; interface addresses are auto-detected.
advertised_addrs = []

# Per-call participant ceiling (2..=24). A room can lower it, never raise.
max_participants = 12

# Live (non-empty) calls across all owners.
max_concurrent_calls = 4
